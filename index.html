<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>IntoTouch WL Helper – Rekrutacja</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #030307 0%, #c0a612ad 50%, #09090f 100%);
      color: #e0e0ff;
      min-height: 100vh;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 20px 15px;
    }
    header {
      text-align: center;
      padding: 30px 0 20px;
      background: rgba(0,0,0,0.6);
      border-bottom: 3px solid #ffe600;
      box-shadow: 0 4px 20px rgba(255,111,0,0.3);
    }
    h1 {
      margin: 0;
      font-size: 3rem;
      color: #fffb00;
      text-shadow: 0 0 15px #000000, 0 0 30px #ffd000dc;
      letter-spacing: 2px;
    }
    h2 {
      color: #fffb00;
      text-shadow: 0 0 10px #000000;
      border-bottom: 2px solid #ff6f0044;
      padding-bottom: 8px;
      margin-top: 2rem;
    }
    .section {
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(8px);
      border: 1px solid #fbff0044;
      border-radius: 12px;
      padding: 24px;
      margin: 24px 0;
      box-shadow: 0 6px 25px rgba(0,0,0,0.5);
    }
    label {
      display: block;
      margin: 14px 0 6px;
      font-weight: bold;
      color: #d1caa2;
    }
    input[type="text"],
    input[type="number"],
    textarea {
      width: 100%;
      padding: 12px;
      background: rgba(255,255,255,0.08);
      border: 1px solid #ffd900c0;
      border-radius: 8px;
      color: #fff;
      font-size: 16px;
      box-sizing: border-box;
    }
    input:focus, textarea:focus {
      outline: none;
      border-color: #ffcc00;
      box-shadow: 0 0 12px #ffcc0066;
    }
    .radio-group label {
      font-weight: normal;
      color: #e0e0ff;
      margin: 8px 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    button {
      padding: 14px 32px;
      margin: 16px 12px 8px 0;
      background: linear-gradient(90deg, #ffe600c4, #ffaa00);
      color: #0f0c29;
      font-weight: bold;
      font-size: 1.1rem;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(255, 238, 0, 0.685);
      transition: all 0.25s;
    }
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(252, 252, 252, 0.7);
    }
    .hidden { display: none !important; }
    #wynik {
      white-space: pre-wrap;
      font-family: 'Courier New', monospace;
      background: rgba(10, 5, 30, 0.9);
      color: #dbdbdb;
      padding: 20px;
      border-radius: 12px;
      border: 1px solid #00ff9d44;
      margin-top: 30px;
      box-shadow: 0 0 30px #00ff9d33;
    }
    #wynik a {
      color: #ffcc00;
      text-decoration: underline;
      font-weight: bold;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>IntoTouch WL Helper</h1>
    <p style="color:#d1d1d1; margin-top:8px;">Notatka Whitelist</p>
  </header>

  <div class="section">
    <label>Imię:</label>
    <input type="text" id="imie" placeholder="np. Adam">

    <label>Wiek:</label>
    <input type="number" id="wiek" min="16" max="80" placeholder="np. 28">

    <label>Serwery, na których grałeś wcześniej:</label>
    <textarea id="serwery" rows="3" placeholder="Pixa, Atlantis, Wyspa, inne..."></textarea>
  </div>

  <div class="section">
    <h2>Pomysł na postać</h2>
    <div class="radio-group">
      <label><input type="radio" name="frakcja" value="Crime" checked> Crime</label>
      <label><input type="radio" name="frakcja" value="SAMS"> SAMS</label>
      <label><input type="radio" name="frakcja" value="LSPD"> LSPD</label>
      <label><input type="radio" name="frakcja" value="SADCR"> SADCR</label>
      <label><input type="radio" name="frakcja" value="LSFD"> LSFD</label>
      <label><input type="radio" name="frakcja" value="Cywil"> Cywil / Biznes / Inne</label>
    </div>
  </div>

  <button id="rozpocznij">Rozpocznij pytania →</button>

  <div id="etapy" class="hidden">
    <div class="section" id="etap-regulamin">
      <h2>Regulamin</h2>
      <div id="pytania-regulamin"></div>
      <button id="dalej-kreatywnosc">Dalej → Kreatywność</button>
    </div>

    <div class="section hidden" id="etap-kreatywnosc">
      <h2>Kreatywność</h2>
      <div id="pytania-kreatywnosc"></div>
      <button id="dalej-lore">Dalej → Lore</button>
    </div>

    <div class="section hidden" id="etap-lore">
      <h2>Lore postaci</h2>
      <div id="pytania-lore"></div>
      <button id="zakoncz">Zakończ i wygeneruj podsumowanie</button>
    </div>
  </div>

  <div id="wynik" class="hidden"></div>
</div>

<script>
// ────────────────────────────────────────────────
// Pula pytań – możesz dowolnie rozszerzać
const pulaPytan = {
  regulamin: [
    "Czym jest Powergaming (PG)?",
    "Czym jest Metagaming (MG)?",
    "Co rozumiesz przez FailRP?",
    "Czym jest RDM i VDM?",
    "Co to jest Combat Logging?",
    "Jakie są zasady używania voice changera?",
    "Co oznacza IC i OOC – podaj przykłady?",
    "Co to jest stream sniping i dlaczego jest zabroniony?",
    "Jakie są zasady dotyczące NSFW / ERP na serwerze?",
    "Czy opis, że kobieta jest w widocznej ciąży jest prawidłowy?",
    
  ],
  kreatywnosc: [
    "Opisz, jak Twoja postać zachowałaby się podczas napadu na sklep.",
    "Jak Twoja postać zareagowałaby na policyjną obławę?",
    "Opisz sytuację, w której Twoja postać musi szybko uciekać po strzelaninie.",
    "Jak Twoja postać negocjowałaby okup za porwanego cywila?",
    "Opisz reakcję postaci na zdradę kumpla z ekipy.",
    "JJesteś cywilem i akurat przechodzisz przed sklepem, bo miałeś iść na zakupy. Na drugiej stronie ulicy w brudnej uliczce widzisz dwie grupy osób, ewidentnie się kłócą, jest dym. Jedna osoba z grupy sięga po pistolet za pasem. Co robisz w takiej sytuacji?",
    "Opisz scenę, w której Twoja postać popełnia duży błąd i musi się ratować.",
    "Jesteś przetrzymywany w ciemnej piwnicy i nagle dostajesz od nieznanego napastnika w tył głowy-tracisz przytomność od uderzenia. Gracz, który cię zaatakował odgrywa /do ofiara od obrażeń traci wszelkie wspomnienia z porwania. Co zrobisz w tej sytuacji?",
    "Jaki sekret mogłaby skrywać twoja postać, który po wyjawieniu wpłynąłby negatywnie na jej opinie?",
    "Opisz mi typowy dzień twojej postaci w jej codziennej rutynie.",
    "Jaka była Twoja najlepsza akcja rp?",
    "Daj mi trzy przykłady, jak w niekonwencjonalny sposób mógłbyś zarobić jakiś pieniądz?",
    "Twoje auto zostało zniszczone przez błąd gry, jedziesz do mechanika, który na starcie pyta się ciebie, jak to się stało?",
    "Jakiś losowy npc potrąca Twoja postac i dostajesz bw, wokół Ciebie nie ma żadnych graczy którzy mogą Ci pomoc. Co robisz?",
    "Jak się zachowam jak auto będzie dachować ale finalnie wyląduje na kołach? Co robisz?",
    "Oficer zatrzymuje Cię na traffic stopie i pyta o ID. Co robisz w tej sytuacji?",
    "Drugi gracz teleportuje się podczas chodzenia, jak poinformujesz go o tym aby podskoczył?",
    "Gracz odgrywa na /me, że wyciąga z kieszeni kolegi portfel i odgrywa na /do że nie był w stanie tego wyczuć. Czy zostało to prawidłowo odegrane?",
    "Jak odegrasz na opisie, że jesteś stary i wysoki?",

  ],
  lore: [
  "Czy dostaniesz się autem z Los Santos do San Francisco?",
  "W którym roku dzieje się akcja fabularna na serwerze?",
  "Jakimi środkami transportu możemy dostać się do Los Santos np. z Meksyku?",
  "Jak nazywa się stan, w którym dzieje się rozgrywka?",
  "Jakie są sklepy odzieżowe?",
  "Jakie są lorowe nazwy pojazdów?",
  ""
  ]
};
// ────────────────────────────────────────────────

let pytaniaWybrane = {};
let grupyRadio = [];

function losujPytania(kategoria, ile = 4) {
  const pula = pulaPytan[kategoria] || [];
  if (pula.length === 0) return [];
  const kopia = [...pula];
  const wylosowane = [];
  for (let i = 0; i < ile && kopia.length > 0; i++) {
    const idx = Math.floor(Math.random() * kopia.length);
    wylosowane.push(kopia.splice(idx, 1)[0]);
  }
  return wylosowane;
}

function stworzPytanieHTML(kategoria, tresc, index) {
  const name = `ocena-${kategoria}-${index}`;
  grupyRadio.push(name);
  return `
    <div style="margin: 18px 0; padding: 12px; background: rgba(255,111,0,0.08); border-radius: 8px;">
      <strong style="color:#ffd700;">${tresc}</strong><br><br>
      <label style="color:#e0e0ff;"><input type="radio" name="${name}" value="dobrze"> ✅ Dobrze</label>
      <label style="color:#e0e0ff;"><input type="radio" name="${name}" value="zle" checked> ❌ Źle</label>
    </div>
  `;
}

function renderujPytania(kategoria) {
  const kontener = document.getElementById(`pytania-${kategoria}`);
  kontener.innerHTML = '';
  const lista = pytaniaWybrane[kategoria] || [];
  lista.forEach((p, i) => {
    kontener.innerHTML += stworzPytanieHTML(kategoria, p, i);
  });
}

function pokazEtap(id) {
  document.querySelectorAll('#etapy > .section').forEach(el => el.classList.add('hidden'));
  document.getElementById(id).classList.remove('hidden');
}

function generujPodsumowanie() {
  const imie    = document.getElementById('imie').value.trim()    || '[brak]';
  const wiek    = document.getElementById('wiek').value.trim()    || '[brak]';
  const serwery = document.getElementById('serwery').value.trim() || '[brak]';
  const frakcja = document.querySelector('input[name="frakcja"]:checked')?.value || 'Cywil';

  const bledy = grupyRadio.reduce((sum, name) => {
    const radio = document.querySelector(`input[name="${name}"]:checked`);
    return sum + (radio?.value === 'zle' ? 1 : 0);
  }, 0);

  const linie = [
    "```md",
    "# IntoTouch WL – Podsumowanie rekrutacji",
    "",
    `**Imię postaci:** ${imie}`,
    `**Wiek postaci:** ${wiek}`,
    `**Serwery wcześniej:** ${serwery}`,
    `**Pomysł na postać / frakcję:** ${frakcja}`,
    "",
    "## Regulamin",
  ];

  (pytaniaWybrane.regulamin || []).forEach((pyt, i) => {
    const name = `ocena-regulamin-${i}`;
    const radio = document.querySelector(`input[name="${name}"]:checked`);
    const ocena = radio?.value === 'dobrze' ? '✅ Dobrze' : '❌ Źle';
    linie.push(`- **${pyt}** → ${ocena}`);
  });

  linie.push("");
  linie.push("## Kreatywność");

  (pytaniaWybrane.kreatywnosc || []).forEach((pyt, i) => {
    const name = `ocena-kreatywnosc-${i}`;
    const radio = document.querySelector(`input[name="${name}"]:checked`);
    const ocena = radio?.value === 'dobrze' ? '✅ Dobrze' : '❌ Źle';
    linie.push(`- **${pyt}** → ${ocena}`);
  });

  linie.push("");
  linie.push("## Lore postaci");

  (pytaniaWybrane.lore || []).forEach((pyt, i) => {
    const name = `ocena-lore-${i}`;
    const radio = document.querySelector(`input[name="${name}"]:checked`);
    const ocena = radio?.value === 'dobrze' ? '✅ Dobrze' : '❌ Źle';
    linie.push(`- **${pyt}** → ${ocena}`);
  });

  linie.push("");
  linie.push(`**Łączna liczba błędów:** ${bledy}/∞`);
  linie.push(bledy <= 2
    ? "**WERDYKT:** ZDAŁ POZYTYWNIE ✅"
    : "**WERDYKT:** DO POPRAWY / NIE ZDAŁ ❌");
  linie.push("```");

  const tekst = linie.join('\n');

  const div = document.getElementById('wynik');
  div.textContent = tekst;
  div.classList.remove('hidden');

  const blob = new Blob([tekst], { type: 'text/plain' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `IntoTouch_WL_${imie.replace(/\s+/g,'_') || 'kandydat'}.txt`;
  a.textContent = 'Pobierz podsumowanie (.txt)';
  a.style.cssText = 'display:block; margin:24px 0; padding:14px 28px; background:#ff6f00; color:#0f0c29; border-radius:50px; text-align:center; font-weight:bold; text-decoration:none; box-shadow:0 4px 15px rgba(255,111,0,0.5);';
  div.appendChild(a);
}

// ─── Eventy ──────────────────────────────────────

document.getElementById('rozpocznij').addEventListener('click', () => {
  if (!document.getElementById('imie').value.trim()) {
    return alert('Podaj imię postaci!');
  }

  // Losowanie pytań na każdą nową sesję
  pytaniaWybrane.regulamin    = losujPytania('regulamin', 4);
  pytaniaWybrane.kreatywnosc  = losujPytania('kreatywnosc', 3);
  pytaniaWybrane.lore         = losujPytania('lore', 3);

  grupyRadio = [];

  document.getElementById('rozpocznij').classList.add('hidden');
  document.getElementById('etapy').classList.remove('hidden');
  document.getElementById('etap-regulamin').classList.remove('hidden');
  renderujPytania('regulamin');
});

document.getElementById('dalej-kreatywnosc').addEventListener('click', () => {
  document.getElementById('etap-regulamin').classList.add('hidden');
  document.getElementById('etap-kreatywnosc').classList.remove('hidden');
  renderujPytania('kreatywnosc');
});

document.getElementById('dalej-lore').addEventListener('click', () => {
  document.getElementById('etap-kreatywnosc').classList.add('hidden');
  document.getElementById('etap-lore').classList.remove('hidden');
  renderujPytania('lore');
});

document.getElementById('zakoncz').addEventListener('click', generujPodsumowanie);
</script>
</body>
</html>
